<!doctype html>
<!-- שפת הדף וכיוונו מוחלפים בשרת (hooks.server.ts) לפי שפת הגולש -->
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<!-- תגי Open Graph / טוויטר (שם האתר ושפה) נוצרים ב-+layout.svelte, כדי שיהיו בשפת הגולש -->
		<!-- Google Analytics — נכס משותף לכל אתרי "יוצאים לחירות". ההפרדה בין
		     האתרים נעשית לפי hostName, ולכן אותו מזהה משמש את כולם. -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-YTEG7S0H9N"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() { dataLayer.push(arguments); }
			gtag('js', new Date());
			gtag('config', 'G-YTEG7S0H9N');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- עורך הכיתובים של הרשת (סופר-אדמין): סקריפט אחד משותף מה-API, בלי קוד באתר (community-backend/public/site-editor.js) -->
		<script defer src="https://api.gofreeil.com/site-editor.js" data-site="experts"></script>
	</body>
</html>
